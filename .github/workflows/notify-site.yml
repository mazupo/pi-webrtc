name: Rebuild mazupo.com docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::CF_PAGES_DEPLOY_HOOK is not set — mazupo.com will not pick up these docs changes."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
